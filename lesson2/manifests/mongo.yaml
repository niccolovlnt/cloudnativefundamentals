# Volume persistente:, richiesta di 1Gi
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: cnf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: cnf
spec:
  replicas: 1
  strategy:
    type: Recreate        # il volume e' RWO, il vecchio Pod deve sparire prima del nuovo
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_PASSWORD
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
# Service ClusterIP: nome DNS stabile "mongo" davanti ai Pod con label app=mongo
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: cnf
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
