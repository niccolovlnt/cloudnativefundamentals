#punto di ingresso della nostra applicazione
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: cnf
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
