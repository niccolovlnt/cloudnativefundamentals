apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cnf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: cnf-web:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_PASSWORD
            # $(VAR) viene espanso da Kubernetes con le variabili definite sopra
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST):27017/$(MONGO_DB)?authSource=admin"
          readinessProbe:       # il Pod riceve traffico solo se risponde
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:        # se fallisce il kubelet riavvia il container
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cnf
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8000
